name: Release image

on:
    push:
        tags: ["v*.*.*"]
    workflow_dispatch:

permissions:
    contents: read
    packages: write

jobs:
    publish:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
            - uses: docker/setup-qemu-action@v3
            - uses: docker/setup-buildx-action@v3
            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - id: meta
              uses: docker/metadata-action@v5
              with:
                  # Image name = repository name (lower-case for GHCR).
                  images: ghcr.io/${{ github.repository_owner }}/jetlag-hide-seek
                  tags: |
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=sha,format=short
                  flavor: latest=false
            - id: build
              uses: docker/build-push-action@v6
              with:
                  context: .
                  platforms: linux/arm64,linux/amd64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  build-args: APP_VERSION=${{ steps.meta.outputs.version }}
                  # Attestation manifests confuse the Jetson's old Docker.
                  provenance: false
                  sbom: false
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
            - name: Summary
              run: |
                  {
                    echo "### Published"
                    echo
                    echo "Pin this in the homeserver compose file:"
                    echo
                    echo '```'
                    echo "image: ghcr.io/${{ github.repository_owner }}/jetlag-hide-seek:${{ steps.meta.outputs.version }}@${{ steps.build.outputs.digest }}"
                    echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"
